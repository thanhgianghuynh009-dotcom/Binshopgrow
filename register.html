<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - Bin GAG2</title>

<link rel="stylesheet" href="style.css">

<style>
.box{
max-width:400px;
margin:50px auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.box h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#ff2d55;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#ff2d55;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<div class="box">

<h2>Đăng ký</h2>

<input type="text" id="username" placeholder="Tên người dùng">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Mật khẩu">

<input type="password" id="confirm" placeholder="Nhập lại mật khẩu">

<button onclick="register()">
Đăng ký
</button>

<p>
Đã có tài khoản?
<a href="login.html">Đăng nhập</a>
</p>

</div>

<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
