<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin GAG2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#ff2f57;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

header h2{
font-size:22px;
}

.login{
background:white;
color:#ff2f57;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.banner{
margin:15px;
border-radius:15px;
overflow:hidden;
}

.banner img{
width:100%;
display:block;
}

.title{
font-size:24px;
font-weight:bold;
margin:15px;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.card h3{
padding:10px;
}

.card button{
width:90%;
margin:10px;
padding:12px;
border:none;
background:#ff2f57;
color:white;
border-radius:10px;
font-size:16px;
}
</style>

</head>

<body>

<header>

<h2>Bin GAG2</h2>

<a href="login.html" class="login">
Đăng nhập
</a>

</header>

<div class="banner">

<img src="banner.jpg">

</div>

<div class="title">
DỊCH VỤ GAG 2
</div>

<div class="menu">

<div class="card">

<img src="seed.jpg">

<h3>Hạt Giống VIP</h3>

<button onclick="location='seed.html'">
Xem tất cả
</button>

</div>

<div class="card">

<img src="pet.jpg">

<h3>Pet VIP</h3>

<button onclick="location='pet.html'">
Xem tất cả
</button>

</div>

<div class="card">

<img src="gear.jpg">

<h3>Gear</h3>

<button onclick="location='gear.html'">
Xem tất cả
</button>

</div>

<div class="card">

<img src="money.jpg">

<h3>Sheckles</h3>

<button onclick="location='money.html'">
Xem tất cả
</button>

</div>

</div>

</body>
</html>
