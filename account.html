<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tài khoản | Bin GAG2 Shop</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}


.box{
width:90%;
max-width:400px;
background:white;
margin:50px auto;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px #ccc;
}


.avatar{
width:80px;
height:80px;
border-radius:50%;
}


button,a{
display:block;
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:12px;
background:#ff2f57;
color:white;
text-decoration:none;
font-weight:bold;
}


</style>

</head>


<body>


<div class="box">


<img src="avatar.png" class="avatar">


<h2>👤 Tài khoản</h2>


<p id="email"></p>


<a href="napthe.html">
💳 Nạp card
</a>


<a href="history-card.html">
📜 Lịch sử nạp card
</a>


<a href="history-buy.html">
🛒 Lịch sử mua vật phẩm
</a>


<button onclick="logout()">
🚪 Đăng xuất
</button>


</div>



<script>

let email = localStorage.getItem("email");

document.getElementById("email").innerHTML = email;



function logout(){

localStorage.removeItem("login");
localStorage.removeItem("email");

window.location.href="index.html";

}


</script>


</body>
</html>
